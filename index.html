
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RACING P - 3D Circuit Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#07131ddd;padding:10px 13px;border:1px solid #36d6ff;border-radius:10px;font-weight:bold;text-shadow:0 1px 3px #000}
#speed{font-size:22px;color:#5ee7ff}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px}
.group{display:flex;gap:12px}
.control{width:68px;height:68px;border-radius:50%;border:2px solid #66ddff;background:#102b42dd;color:white;font-size:25px;font-weight:bold;touch-action:none}
#gas{background:#087c45dd}
#brake{background:#a42d2ddd}
#menu{position:fixed;inset:0;background:#06121deF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
h1{font-size:48px;color:#54ddff;margin:0 0 8px;text-shadow:0 0 18px #00aaff}
#menu p{max-width:340px;line-height:1.5;color:#d7e8f1}
#start{padding:16px 40px;border:0;border-radius:12px;background:#00b9e8;color:#00131c;font-size:20px;font-weight:bold}
#message{position:fixed;top:28%;width:100%;text-align:center;font-size:25px;font-weight:bold;pointer-events:none;text-shadow:0 2px 5px black}
</style>
</head>
<body>
<div id="hud">
 <div class="panel">LAP <span id="lap">0/3</span><br>POS <span id="pos">1/4</span></div>
 <div class="panel" id="speed">0 KM/H</div>
 <div class="panel">TIME<br><span id="time">00:00</span></div>
</div>
<div id="message"></div>
<div id="controls">
 <div class="group">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="group">
  <button class="control" id="brake">▼</button>
  <button class="control" id="gas">▲</button>
 </div>
</div>
<div id="menu">
 <h1>RACING P</h1>
 <h2>3D CIRCUIT RACING</h2>
 <p>Balapan di sirkuit 3D! Kalahkan tiga mobil lawan dan selesaikan tiga putaran. Gunakan tombol kiri, kanan, gas, dan rem.</p>
 <button id="start">MULAI BALAPAN</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87c8ed);
scene.fog=new THREE.Fog(0x87c8ed,100,220);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x536b36,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-30,60,25);sun.castShadow=true;scene.add(sun);

const grass=new THREE.Mesh(new THREE.PlaneGeometry(220,180),new THREE.MeshStandardMaterial({color:0x388344}));
grass.rotation.x=-Math.PI/2;grass.position.y=-.15;scene.add(grass);

function makeTrack(){
 const s=new THREE.Shape();
 s.absellipse(0,0,46,31,0,Math.PI*2,false,0);
 const hole=new THREE.Path();
 hole.absellipse(0,0,35,20,0,Math.PI*2,true,0);
 s.holes.push(hole);
 const g=new THREE.ExtrudeGeometry(s,{depth:.18,bevelEnabled:false,curveSegments:100});
 g.rotateX(-Math.PI/2);
 const road=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x34383d,roughness:.9}));
 road.position.y=.02;road.receiveShadow=true;scene.add(road);
 // Garis tepi lintasan
 for(const r of [46,31,35,20]){
  const line=new THREE.Mesh(new THREE.TorusGeometry(r, r===46||r===35?.22:.18,6,160),new THREE.MeshStandardMaterial({color:0xffffff}));
  line.rotation.x=Math.PI/2;line.scale.z=r===46||r===35?.68:.65;
  line.position.y=.25;scene.add(line);
 }
 // Garis start
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(1,.04,11),new THREE.MeshBasicMaterial({color:0xffffff}));
 stripe.position.set(0,.24,-25);scene.add(stripe);
}
makeTrack();

// Tribun sederhana
for(let i=0;i<18;i++){
 const a=i/18*Math.PI*2;
 const x=Math.cos(a)*57,z=Math.sin(a)*39;
 const stand=new THREE.Mesh(new THREE.BoxGeometry(7,3,5),new THREE.MeshStandardMaterial({color:i%2?0x2454a0:0xc63b35}));
 stand.position.set(x,1.3,z);scene.add(stand);
}

function makeCar(color){
 const car=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.65,4),new THREE.MeshStandardMaterial({color,metalness:.25,roughness:.35}));
 body.position.y=.8;body.castShadow=true;car.add(body);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.7,1.8),new THREE.MeshStandardMaterial({color:0x152b3c,metalness:.5,roughness:.2}));
 cabin.position.set(0,1.35,-.2);car.add(cabin);
 for(const x of [-1.12,1.12])for(const z of [-1.25,1.25]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,16),new THREE.MeshStandardMaterial({color:0x111111}));
  wheel.rotation.z=Math.PI/2;wheel.position.set(x,.48,z);car.add(wheel);
 }
 const lampMat=new THREE.MeshBasicMaterial({color:0xffffcc});
 for(const x of [-.7,.7]){
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(.4,.2,.08),lampMat);
  lamp.position.set(x,.9,-2.02);car.add(lamp);
 }
 return car;
}
const player=makeCar(0x00aaff);scene.add(player);
const rivals=[];
const colors=[0xff3322,0xffcc00,0x9b55ff];
for(let i=0;i<3;i++){const c=makeCar(colors[i]);scene.add(c);rivals.push(c)}

const R=40.5,Z=25.5;
function trackPoint(t,offset=0){
 return new THREE.Vector3(Math.cos(t)*(R+offset),0,Math.sin(t)*(Z+offset));
}
let angle=0,speed=0,steer=0,started=false,finished=false,lap=0,elapsed=0,lastAngle=0;
let gas=false,brake=false,left=false,right=false;
const $=id=>document.getElementById(id);
function bind(id,fn){
 const e=$(id);
 e.addEventListener('pointerdown',ev=>{ev.preventDefault();fn(true)});
 e.addEventListener('pointerup',()=>fn(false));
 e.addEventListener('pointerleave',()=>fn(false));
 e.addEventListener('pointercancel',()=>fn(false));
}
bind('gas',v=>gas=v);bind('brake',v=>brake=v);
bind('left',v=>left=v);bind('right',v=>right=v);

let audioCtx,osc,gain;
function soundOn(){
 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  osc=audioCtx.createOscillator();gain=audioCtx.createGain();
  osc.type='sawtooth';osc.frequency.value=65;gain.gain.value=.025;
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start();
 }catch(e){}
}
function formatTime(t){
 const m=Math.floor(t/60),s=Math.floor(t%60);
 return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function update(dt){
 if(!started||finished)return;
 elapsed+=dt;
 if(gas)speed=Math.min(speed+25*dt,180);
 else speed=Math.max(0,speed-8*dt);
 if(brake)speed=Math.max(0,speed-55*dt);
 if(left)steer=1;else if(right)steer=-1;else steer=0;
 angle+=((speed/180)*.75+steer*(speed/180)*.9)*dt;
 // Mobil mengikuti jalur oval, kemudi mengubah posisi ke sisi lintasan
 const offset=steer*1.8;
 const p=trackPoint(angle,offset);
 player.position.set(p.x,.1,p.z);
 player.rotation.y=-Math.atan2(-Math.sin(angle)*Z,Math.cos(angle)*R);
 // Lawan bergerak otomatis
 rivals.forEach((c,i)=>{
  const t=angle+(i+1)*.42+elapsed*(.12+i*.018);
  const q=trackPoint(t,0);
  c.position.set(q.x,.1,q.z);
  c.rotation.y=-Math.atan2(-Math.sin(t)*Z,Math.cos(t)*R);
 });
 const progress=(angle%(Math.PI*2))/(Math.PI*2);
 const newLap=Math.floor(angle/(Math.PI*2));
 if(newLap>lap){lap=newLap;$('lap').textContent=Math.min(lap,3)+'/3'}
 if(lap>=3){
  finished=true;
  $('message').textContent='🏆 BALAPAN SELESAI!';
  $('menu').style.display='flex';
  $('menu').querySelector('h2').textContent='WAKTU: '+formatTime(elapsed);
  $('start').textContent='BALAP LAGI';
 }
 $('speed').textContent=Math.round(speed)+' KM/H';
 $('time').textContent=formatTime(elapsed);
 if(osc&&audioCtx)osc.frequency.setTargetAtTime(55+speed*1.2,audioCtx.currentTime,.08);
}
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 const behind=new THREE.Vector3(Math.sin(angle)*13,8,Math.cos(angle)*13);
 camera.position.lerp(new THREE.Vector3(player.position.x+behind.x,behind.y,player.position.z+behind.z),.09);
 camera.lookAt(player.position.x,1,player.position.z);
 renderer.render(scene,camera);
}
animate();

$('start').onclick=()=>{
 if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
 soundOn();
 angle=0;speed=0;lap=0;elapsed=0;finished=false;started=true;
 $('lap').textContent='0/3';$('time').textContent='00:00';
 $('message').textContent='';
 $('menu').style.display='none';
};
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
